<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<title>CryptoPriceTicker</title>
<style>
.ring{transform-origin:32px 32px;animation:spin 14s linear infinite}
.c{transform-box:fill-box;transform-origin:50% 100%;animation:rise 6s cubic-bezier(.2,.8,.2,1.2) infinite}
.c2{animation-delay:.15s}.c3{animation-delay:.3s}
.line{stroke-dasharray:100;animation:draw 6s cubic-bezier(.6,0,.2,1) infinite}
.head{transform-box:fill-box;transform-origin:30% 70%;animation:pop 6s cubic-bezier(.2,.8,.2,1.4) infinite}
.arrow{animation:fade 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%,8%{transform:scaleY(0)}22%,100%{transform:scaleY(1)}}
@keyframes draw{0%,10%{stroke-dashoffset:100}32%,100%{stroke-dashoffset:0}}
@keyframes pop{0%,28%{transform:scale(0)}36%{transform:scale(1.18)}42%,100%{transform:scale(1)}}
@keyframes fade{0%,90%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="#2b1366"/><stop offset=".55" stop-color="#140b33"/><stop offset="1" stop-color="#08051c"/></radialGradient>
<linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff3fd8"/><stop offset=".5" stop-color="#9b5cff"/><stop offset="1" stop-color="#22e8ff"/></linearGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="9" y1="51" x2="53" y2="11"><stop offset="0" stop-color="#ff7a1a"/><stop offset=".5" stop-color="#ffc63a"/><stop offset="1" stop-color="#fff3b4"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="64" height="64" rx="15" fill="url(#bg)"/>
<circle class="ring" filter="url(#glow)" cx="32" cy="32" r="22.5" fill="none" stroke="url(#ring)" stroke-width="3.4"/>
<g stroke-linecap="round">
<path d="M38.5 36v13M43.5 31v14M48.5 27v12" stroke-width="1.2" stroke="#7d6bd6"/>
<rect class="c" x="36.8" y="39" width="3.4" height="7" rx=".8" fill="#ff3fd8"/>
<rect class="c c2" x="41.8" y="33.5" width="3.4" height="9" rx=".8" fill="#22e8ff"/>
<rect class="c c3" x="46.8" y="29.5" width="3.4" height="7" rx=".8" fill="#22e8ff"/>
</g>
<g class="arrow">
<path class="line" pathLength="100" d="M9 51 L24 33 L30.5 41 L45 21.5" fill="none" stroke="#08051c" stroke-width="7.8" stroke-linejoin="miter" stroke-linecap="round"/>
<path class="head" d="M53 11 L51 24.4 L40.6 16.6 Z" fill="#08051c" stroke="#08051c" stroke-width="2.4" stroke-linejoin="round"/>
<g filter="url(#glow)">
<path class="line" pathLength="100" d="M9 51 L24 33 L30.5 41 L45 21.5" fill="none" stroke="url(#gold)" stroke-width="5.6" stroke-linejoin="miter" stroke-linecap="round"/>
<path class="head" d="M53 11 L51 24.4 L40.6 16.6 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="1" stroke-linejoin="round"/>
</g>
</g>
</svg>
