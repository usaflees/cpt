<!DOCTYPE html>
<html lang="en" data-theme="kali">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>CryptoPriceTicker.com | Live Crypto Prices — Zero Login, 100% Private</title>
  <meta name="description" content="Real-time WebSocket cryptocurrency price ticker, liquidity tracker, and private local portfolio. Zero login required, no account walls, instant Kali terminal & dark themes." />
  <style>
    :root, [data-theme="kali"] {
      --bg-primary: #050709;
      --bg-secondary: #0a0e14;
      --bg-tertiary: #101722;
      --bg-hover: rgba(0, 255, 102, 0.06);
      --text-primary: #00ff66;
      --text-secondary: #6bd999;
      --text-muted: #3d7a5a;
      --accent: #268bee;
      --accent-glow: rgba(38, 139, 238, 0.28);
      --border: #152920;
      --up: #00ff66;
      --up-bg: rgba(0, 255, 102, 0.16);
      --down: #ff3355;
      --down-bg: rgba(255, 51, 85, 0.18);
      --sponsor-bg: rgba(38, 139, 238, 0.08);
      --font-main: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace;
    }
    [data-theme="slate"] {
      --bg-primary: #12161f;
      --bg-secondary: #1b212d;
      --bg-tertiary: #242c3d;
      --bg-hover: rgba(255, 255, 255, 0.04);
      --text-primary: #eef2f8;
      --text-secondary: #9aa7bd;
      --text-muted: #64728c;
      --accent: #26a69a;
      --accent-glow: rgba(38, 166, 154, 0.25);
      --border: #2a3346;
      --up: #2ebd85;
      --up-bg: rgba(46, 189, 133, 0.16);
      --down: #f6465d;
      --down-bg: rgba(246, 70, 93, 0.16);
      --sponsor-bg: rgba(240, 185, 11, 0.07);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="oled"] {
      --bg-primary: #000000;
      --bg-secondary: #08080a;
      --bg-tertiary: #121216;
      --bg-hover: rgba(153, 69, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #52525b;
      --accent: #14f195;
      --accent-glow: rgba(20, 241, 149, 0.22);
      --border: #1f1f26;
      --up: #14f195;
      --up-bg: rgba(20, 241, 149, 0.15);
      --down: #ff2e63;
      --down-bg: rgba(255, 46, 99, 0.16);
      --sponsor-bg: rgba(153, 69, 255, 0.08);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="light"] {
      --bg-primary: #f4f6f9;
      --bg-secondary: #ffffff;
      --bg-tertiary: #edf1f7;
      --bg-hover: rgba(15, 23, 42, 0.035);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --border: #e2e8f0;
      --up: #059669;
      --up-bg: rgba(5, 150, 105, 0.12);
      --down: #e11d48;
      --down-bg: rgba(225, 29, 72, 0.12);
      --sponsor-bg: rgba(2, 132, 199, 0.05);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 13.5px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; outline: none; }
    button { cursor: pointer; }
    .tabular { font-variant-numeric: tabular-nums; }
    .container { max-width: 1440px; margin: 0 auto; padding: 0 14px; }
    .top-utility-bar { background: var(--bg-secondary); border-bottom: 1px solid var(--border); font-size: 11.5px; padding: 6px 0; }
    .utility-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .status-cluster { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .ws-indicator { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--up); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.55; } }
    .zero-login-pill { background: var(--bg-tertiary); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; color: var(--text-secondary); font-weight: 600; }
    .theme-switcher { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .theme-btn { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); }
    .theme-btn.active { border-color: var(--accent); background: var(--accent-glow); color: var(--text-primary); }
    .main-header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 12px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 34px; height: 34px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--up)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #050709; }
    .brand-title { font-size: 17px; font-weight: 800; }
    .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
    .search-box { position: relative; min-width: 220px; max-width: 320px; flex: 1; }
    .search-box input { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 7px 28px 7px 30px; color: var(--text-primary); font-size: 12.5px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .btn-group { display: inline-flex; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .btn-group button { padding: 6px 10px; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
    .btn-group button.active { background: var(--accent); color: #ffffff; }
    .action-btn { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px; font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(265px, 1fr)); gap: 12px; margin: 12px 0; }
    .summary-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 13px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12.5px; }
    .card-label { color: var(--text-secondary); }
    .card-val { font-weight: 700; }
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
    .sector-pills { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .pill-btn { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px; font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .pill-btn.active { background: var(--accent-glow); color: var(--text-primary); border-color: var(--accent); }
    .table-wrapper { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th { background: var(--bg-tertiary); color: var(--text-secondary); font-size: 11.5px; font-weight: 700; text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    th.col-left, td.col-left { text-align: left; }
    tr.coin-row { border-bottom: 1px solid var(--border); }
    tr.coin-row:hover { background-color: var(--bg-hover); }
    td { padding: 10px; vertical-align: middle; white-space: nowrap; }
    .price-cell { font-weight: 700; border-radius: 4px; padding: 4px 7px; display: inline-block; }
    .tick-up { background-color: var(--up-bg) !important; color: var(--up) !important; }
    .tick-down { background-color: var(--down-bg) !important; color: var(--down) !important; }
    .coin-identity { display: flex; align-items: center; gap: 9px; }
    .coin-icon { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-tertiary); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; border: 1px solid var(--border); }
    .coin-symbol { font-weight: 800; font-size: 13.5px; }
    .coin-name { font-size: 11px; color: var(--text-muted); display: block; }
    .bag-input { width: 78px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; text-align: right; font-size: 12px; color: var(--text-primary); }
    .bag-val { display: block; font-size: 10.5px; color: var(--up); margin-top: 2px; }
    .pct-pill { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 12px; }
    .pct-up { color: var(--up); background: var(--up-bg); }
    .pct-down { color: var(--down); background: var(--down-bg); }
  </style>
</head>
<body>
  <div class="top-utility-bar">
    <div class="container utility-inner">
      <div class="status-cluster">
        <span class="ws-indicator"><span class="pulse-dot"></span><span id="wsStatusText">LIVE STREAM: CONNECTED</span></span>
        <span class="zero-login-pill">🔒 ZERO-LOGIN LOCAL STORAGE</span>
      </div>
      <div class="theme-switcher">
        <button class="theme-btn active" data-set-theme="kali">KALI GREEN</button>
        <button class="theme-btn" data-set-theme="slate">SLATE</button>
        <button class="theme-btn" data-set-theme="oled">OLED</button>
        <button class="theme-btn" data-set-theme="light">LIGHT</button>
      </div>
    </div>
  </div>

  <header class="main-header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <div class="brand-logo">⚡</div>
        <div>
          <span class="brand-title">CryptoPriceTicker<span style="color:var(--accent)">.com</span></span>
        </div>
      </a>
      <div class="header-controls">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Filter coins..." autocomplete="off" />
        </div>
        <div class="btn-group" id="currencySwitcher">
          <button class="active" data-currency="USD">USD $</button>
          <button data-currency="BTC">BTC ₿</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 16px;">
    <section class="cards-grid">
      <div class="summary-card">
        <div class="card-header"><span>🌐 Market Pulse</span></div>
        <div class="card-row"><span class="card-label">Market Cap</span><span class="card-val tabular" id="globalMcap">$2.65T</span></div>
        <div class="card-row"><span class="card-label">24h Volume</span><span class="card-val tabular" style="color:var(--up)" id="globalVol">$78.4B</span></div>
      </div>
      <div class="summary-card">
        <div class="card-header"><span>💼 My Bag</span></div>
        <div class="card-row"><span class="card-label">Total Value</span><span class="card-val tabular" style="color:var(--up)" id="bagTotalValue">$0.00</span></div>
      </div>
    </section>

    <div class="table-wrapper">
      <table id="tickerTable">
        <thead>
          <tr>
            <th class="col-left" style="width:60px;">#</th>
            <th class="col-left">Coin</th>
            <th>Price</th>
            <th>24h %</th>
            <th>Market Cap</th>
            <th class="col-left">My Bag</th>
          </tr>
        </thead>
        <tbody id="tickerBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const INITIAL_COINS = [
      { id: "bitcoin", symbol: "BTC", name: "Bitcoin", rank: 1, price: 80642.49, change24h: 3.42, mcap: 1621100000000 },
      { id: "ethereum", symbol: "ETH", name: "Ethereum", rank: 2, price: 2372.60, change24h: 1.85, mcap: 290340000000 },
      { id: "solana", symbol: "SOL", name: "Solana", rank: 3, price: 148.40, change24h: 6.18, mcap: 70120000000 },
      { id: "tether", symbol: "USDT", name: "Tether", rank: 4, price: 1.0002, change24h: 0.01, mcap: 149040000000 },
      { id: "ripple", symbol: "XRP", name: "XRP", rank: 5, price: 1.2852, change24h: -0.94, mcap: 81136000000 }
    ];

    let state = {
      coins: structuredClone(INITIAL_COINS),
      currency: "USD",
      theme: "kali",
      watchlist: ["BTC", "SOL"],
      bag: {"BTC": 0.15},
      search: ""
    };

    try {
      if (localStorage.getItem("cpt_theme")) state.theme = localStorage.getItem("cpt_theme");
      if (localStorage.getItem("cpt_bag")) state.bag = JSON.parse(localStorage.getItem("cpt_bag"));
    } catch(e) {}

    function formatPrice(p) {
      return "$" + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderAll() {
      const tbody = document.getElementById("tickerBody");
      let html = "";
      state.coins.forEach(c => {
        const qty = state.bag[c.symbol] || "";
        const holdingUsd = (parseFloat(qty) || 0) * c.price;
        const pctClass = c.change24h >= 0 ? "pct-up" : "pct-down";
        html += `
          <tr class="coin-row">
            <td class="col-left tabular"><span style="color:var(--text-muted)">${c.rank}</span></td>
            <td class="col-left">
              <div class="coin-identity">
                <div class="coin-icon">${c.symbol.slice(0,3)}</div>
                <div><span class="coin-symbol">${c.symbol}</span><span class="coin-name">${c.name}</span></div>
              </div>
            </td>
            <td class="tabular"><span class="price-cell" id="price-${c.symbol}">${formatPrice(c.price)}</span></td>
            <td class="tabular"><span class="pct-pill ${pctClass}">${c.change24h >= 0 ? '+' : ''}${c.change24h.toFixed(2)}%</span></td>
            <td class="tabular">$${(c.mcap/1e9).toFixed(2)}B</td>
            <td class="col-left tabular">
              <input type="number" step="any" min="0" class="bag-input" value="${qty}" oninput="updateBag('${c.symbol}', this.value)" />
              <span class="bag-val">${holdingUsd > 0 ? formatPrice(holdingUsd) : ''}</span>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      document.getElementById("bagTotalValue").textContent = formatPrice(Object.keys(state.bag).reduce((acc, s) => {
        const coin = state.coins.find(co => co.symbol === s);
        return acc + (coin ? (state.bag[s] * coin.price) : 0);
      }, 0));
    }

    window.updateBag = (symbol, val) => {
      const num = parseFloat(val);
      if (!val || isNaN(num) || num <= 0) delete state.bag[symbol];
      else state.bag[symbol] = num;
      try { localStorage.setItem("cpt_bag", JSON.stringify(state.bag)); } catch(e) {}
      renderAll();
    };

    function applyTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("cpt_theme", t); } catch(e) {}
      document.querySelectorAll("[data-set-theme]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-set-theme") === t);
      });
    }

    document.querySelectorAll("[data-set-theme]").forEach(btn => {
      btn.addEventListener("click", () => applyTheme(btn.getAttribute("data-set-theme")));
    });

    applyTheme(state.theme);
    renderAll();

    setInterval(() => {
      const coin = state.coins[Math.floor(Math.random() * state.coins.length)];
      coin.price *= (1 + ((Math.random() - 0.49) * 0.002));
      renderAll();
    }, 1500);
  </script>
</body>
</html>
