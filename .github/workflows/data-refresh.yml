# Weekly market-data refresh without an AI session: refresh supplies and daily-candle stats, rebuild,
# run the full QA suite (lint, links, browser tests, axe, whole-site crawl) and, only if the change is
# data-only (scripts/classify-change.mjs) and not degraded (scripts/check-refresh.mjs), push to main,
# which Cloudflare Pages deploys. Then it checks production and pings IndexNow.
# Same gates as the weekly Claude task's auto-merge (DECISIONS 2026-10-30), with no secrets and no AI.
# Run by hand: Actions → Weekly data refresh → Run workflow (untick "publish" for a dry run).
#
# Two jobs, on purpose (docs/knowledge/ACCESS.md):
#   refresh  read-only token. Calls outside APIs, installs the browser test tools from npm and runs QA.
#            Its only output is a patch file.
#   publish  the only job in this repository whose token can write. It installs nothing: it applies the
#            patch to a clean checkout of main, re-checks with main's own scripts that the patch is
#            data-only and that the pages match the data, and pushes. The token is handed to the push
#            step alone and is never written to .git/config.
# So a compromised npm package, browser download or API response in the first job cannot reach a token
# that can change the live site, and a tampered patch fails the re-check.
name: Weekly data refresh

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to main when every check passes"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    outputs:
      code: ${{ steps.refresh.outputs.code }}
    env:
      QA: ${{ github.workspace }}/../qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Refresh market data and rebuild
        id: refresh
        run: |
          set +e
          bash scripts/weekly-refresh.sh origin/main
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 data-only, 3 no changes: fine. 2 needs review, 1 a step failed: stop.
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Guard against a degraded refresh
        if: steps.refresh.outputs.code == '0'
        run: node scripts/check-refresh.mjs origin/main

      - name: Install browser test tools (outside the repo)
        if: steps.refresh.outputs.code == '0'
        # Exact versions, and --ignore-scripts so no package can run code at install time.
        run: |
          npm i --no-save --no-audit --no-fund --ignore-scripts --prefix "$QA" playwright@1.63.0 axe-core@4.10.2
          "$QA/node_modules/.bin/playwright" install --with-deps chromium

      - name: Full QA
        if: steps.refresh.outputs.code == '0'
        run: |
          NODE_PATH="$QA/node_modules" AXE="$QA/node_modules/axe-core/axe.min.js" bash tests/run.sh | tee "$RUNNER_TEMP/qa.log"
          grep -q "^QA PASSED" "$RUNNER_TEMP/qa.log"

      - name: Package the change for the publish job
        if: steps.refresh.outputs.code == '0'
        run: |
          mkdir -p "$RUNNER_TEMP/refresh"
          git add -A
          git diff --cached --binary HEAD > "$RUNNER_TEMP/refresh/refresh.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/refresh/base"
          echo "Patch: $(git diff --cached --shortstat HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.refresh.outputs.code == '0'
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: refresh
    if: needs.refresh.outputs.code == '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh

      - name: Apply the patch to a clean main
        run: |
          if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/refresh/base")" ]; then
            echo "main moved while the refresh ran: nothing published. Run the workflow again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/refresh/refresh.patch"

      - name: Re-check with main's own scripts
        # Nothing from the first job is trusted: the patch may only touch data files, only numbers may change
        # in the coin list (checked as text, before anything evaluates it), the stats file may hold only
        # numbers, dates and plain names, and every generated page must be exactly what the build makes
        # from that data.
        run: |
          class="$(node scripts/classify-change.mjs HEAD)" || true
          echo "classify-change: $class"
          [ "$class" = "data-only" ]
          node scripts/check-refresh.mjs HEAD
          node scripts/build-coin-pages.mjs
          git diff --exit-code --stat
          node scripts/seo-lint.mjs

      - name: Publish to main
        id: publish
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "old=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git commit -q -m "Data refresh $(date -u +%F): supplies and daily-candle stats (automated)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Production check
        if: steps.publish.outcome == 'success'
        run: |
          bash tests/wait-deploy.sh https://cryptopriceticker.com 900
          node scripts/check-live.mjs

      - name: Tell IndexNow search engines
        if: steps.publish.outcome == 'success'
        env:
          OLD: ${{ steps.publish.outputs.old }}
        run: node scripts/indexnow.mjs "$OLD"
