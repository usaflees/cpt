# Deterministic checks for every pull request and every push to main.
# Read-only token, no secrets, no AI: safe to run on any branch, including pull requests from forks.
# The token is not left in .git/config (persist-credentials: false), and values that come from a pull
# request reach shell commands only through env, never as an expression inside a script. seo-lint enforces
# these rules for every workflow (docs/knowledge/ACCESS.md).
# Actions are pinned to full commit SHAs (GitHub's supply-chain guidance); Dependabot
# (.github/dependabot.yml) proposes updates, keeping the version in the trailing comment.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push to the same PR cancels the older run. Pushes to main each keep their own run, so the
# indexnow job of one push is never cancelled by the next (its changed pages would never be sent).
concurrency:
  group: site-checks-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generated pages are up to date
        run: node scripts/build-coin-pages.mjs && git diff --exit-code
      - name: SEO and site lint
        run: node scripts/seo-lint.mjs
      - name: Rules for automated SEO branches
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/seo-')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/seo-lint.mjs --base "origin/$BASE_REF"

  # After a push to main: wait until production serves this build, then tell IndexNow engines (Bing, Yandex,
  # Seznam, Naver, Yep, Internet Archive, Amazon) which pages changed. Google doesn't use IndexNow; it reads the
  # sitemap. No secrets: the key is the public file in the repo root. Never blocks a deploy.
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for production to serve this build
        # A newer push can supersede this one; the pages are live either way, so carry on after the timeout.
        run: bash tests/wait-deploy.sh https://cryptopriceticker.com 600 || echo "Build not confirmed; sending anyway."
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail  # the default shell is bash -e without pipefail: tee would hide a failed submission
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit unknown (new branch or force-push): nothing sent. Never falls back to --all." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/indexnow.mjs "$BEFORE" | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
          echo "Retrying once in 60 s" && sleep 60
          node scripts/indexnow.mjs "$BEFORE" | tee -a "$GITHUB_STEP_SUMMARY"
